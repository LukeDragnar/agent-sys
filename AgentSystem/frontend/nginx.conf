server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  root /usr/share/nginx/html;

  # Gzip compression
    gzip on;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript font/woff2 image/svg+xml;
    gzip_buffers 16 8k;
    gzip_static on;

    # Cache control for static files
    location ~* \.(?:woff2?|eot|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

     # Location cho index.html và các request trả về index.html (Angular routing)
    location / {
        #try_files $uri /index.html;
        index  index.html;
        try_files $uri $uri/ /index.html?$args;
        # Khi trả về index.html, thêm header no-cache
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        etag off;
    }
}